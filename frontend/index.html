<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoDRAW</title>
	<link rel="icon" type="image/png" href="src/cd_ico.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar" id="toolbar">
        <label for="stroke">Cor:</label>
        <input type="color" id="stroke" name="stroke" value="#000000">
        <label for="lineWidth">Comprimento da Linha:</label>
        <input type="number" id="lineWidth" name="lineWidth" value="5" min="1" max="50">
        <button id="clear">Limpar</button>
    </div>
    <canvas id="drawing-board"></canvas>
    <script src="script.js"></script>
</body>
</html>
